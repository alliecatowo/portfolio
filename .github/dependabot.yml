version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Blocked upstream: vue-tsc 3.3.12 (used by `nuxi typecheck`) requires typescript/lib/tsc,
      # which TypeScript 7 no longer exports. Re-enable once vue-tsc supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Nuxt 4 runs on h3 1.x; h3 2 is still a release candidate.
      - dependency-name: h3
        update-types: ['version-update:semver-major']
    # chore(deps): ... / chore(deps-dev): ... passes commitlint and the semantic PR title check
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Minor and patch updates only. Majors are never grouped, so each one gets its own PR
      # for review. A dependency joins the first group whose patterns match it.
      nuxt-ecosystem:
        update-types: [minor, patch]
        patterns:
          - nuxt
          - nuxt-*
          - nuxi
          - '@nuxt/*'
          - '@nuxtjs/*'
          - vue
          - vue-router
          - '@vue/*'
          - h3
          - ufo
          - zod
          - sharp
          - tailwindcss
          - '@tailwindcss/*'
          - '@iconify-json/*'
          - firebase-admin
          - firebase-functions
      dev-tooling:
        update-types: [minor, patch]
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - '@typescript-eslint/*'
          - prettier
          - typescript
          - vue-tsc
          - lefthook
          - '@commitlint/*'
          - '@axe-core/*'
          - pa11y
          - '@types/*'
      minor-and-patch:
        update-types: [minor, patch]
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
