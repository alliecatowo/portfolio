name: Deploy to Staging

# Manual only. Every push to main already deploys production, and a second identical build for the
# `staging` channel added ~2 min of CI per push for no benefit. Run this to refresh the channel.
on:
  workflow_dispatch:

env:
  FORCE_COLOR: 1
  CI: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment:
      name: Staging
      url: https://allie-portfolio-project--staging.web.app
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Validate content
        run: pnpm run --if-present validate:content

      - name: Build for deployment
        run: pnpm run generate

      - name: Deploy to Firebase Hosting Staging
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALLIE_PORTFOLIO_PROJECT }}
          channelId: staging
          projectId: allie-portfolio-project
