name: Dependabot auto-merge

# Pattern from GitHub's docs ("Automating Dependabot with GitHub Actions"). pull_request_target gives
# Dependabot PRs a token that can merge; it never checks out or runs the PR's code, only reads
# Dependabot's metadata. `gh pr merge --auto` waits for the required `ci-success` check, so nothing
# merges until CI is green.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'alliecatowo/portfolio'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates and security fixes
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.alert-state != ''
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major' && steps.metadata.outputs.alert-state == ''
        run: |
          gh pr comment "$PR_URL" --body "Major version update, so not auto-merged. Read the changelog for breaking changes, then merge by hand once CI is green."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
