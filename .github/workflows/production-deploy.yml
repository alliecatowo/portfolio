name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (defaults to current main)'
        required: false
        type: string

env:
  FORCE_COLOR: 1
  CI: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://allisons.dev
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Setup mise (Node, pnpm)
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "pnpm-store-path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm-store-path }}
          key: ${{ runner.os }}-pnpm10-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm10-pnpm-store-

      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-pnpm10-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm10-node-modules-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Validate content
        run: pnpm run validate:content

      - name: Build for deployment
        run: pnpm run generate

      - name: Deploy to Firebase Hosting Production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALLIE_PORTFOLIO_PROJECT }}
          channelId: live
          projectId: allie-portfolio-project

      # Nuxt Studio's auth/meta routes run in a 2nd-gen Cloud Function (`studio`) that
      # firebase.json rewrites /_studio, /__nuxt_studio/** and /sw.js to. It deploys after
      # Hosting so a function failure never blocks the site, and is skipped for pushes that
      # only touch content/ (every Studio save is one). See STUDIO.md.
      - name: Check whether the Studio function needs a deploy
        id: studio-changes
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git rev-parse -q --verify HEAD~1 >/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD | grep -qv '^content/'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Studio function
        if: steps.studio-changes.outputs.deploy == 'true'
        env:
          STUDIO_GITHUB_CLIENT_ID: ${{ secrets.STUDIO_GITHUB_CLIENT_ID }}
          STUDIO_GITHUB_CLIENT_SECRET: ${{ secrets.STUDIO_GITHUB_CLIENT_SECRET }}
        run: |
          # The session-cookie secret is derived from these at build time, so they're required here too
          if [ -z "$STUDIO_GITHUB_CLIENT_ID" ] || [ -z "$STUDIO_GITHUB_CLIENT_SECRET" ]; then
            echo "::error::STUDIO_GITHUB_CLIENT_ID / STUDIO_GITHUB_CLIENT_SECRET secrets are missing"
            exit 1
          fi
          pnpm run build:studio

      - name: Write Studio function runtime env
        if: steps.studio-changes.outputs.deploy == 'true'
        env:
          STUDIO_GITHUB_CLIENT_ID: ${{ secrets.STUDIO_GITHUB_CLIENT_ID }}
          STUDIO_GITHUB_CLIENT_SECRET: ${{ secrets.STUDIO_GITHUB_CLIENT_SECRET }}
          STUDIO_GITHUB_MODERATORS: ${{ secrets.STUDIO_GITHUB_MODERATORS }}
        run: |
          # The Firebase CLI deploys this .env as the function's environment
          {
            printf 'STUDIO_GITHUB_CLIENT_ID=%s\n' "$STUDIO_GITHUB_CLIENT_ID"
            printf 'STUDIO_GITHUB_CLIENT_SECRET=%s\n' "$STUDIO_GITHUB_CLIENT_SECRET"
            printf 'STUDIO_GITHUB_MODERATORS=%s\n' "$STUDIO_GITHUB_MODERATORS"
          } > .output-studio/server/.env

      - name: Authenticate to Google Cloud
        if: steps.studio-changes.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALLIE_PORTFOLIO_PROJECT }}

      - name: Deploy Studio function
        if: steps.studio-changes.outputs.deploy == 'true'
        run: pnpm dlx firebase-tools@15 deploy --only functions:studio --project allie-portfolio-project --non-interactive --force
