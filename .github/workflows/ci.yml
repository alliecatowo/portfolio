name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# A new push to a PR supersedes the previous run. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 1
  CI: true

jobs:
  # Classifies the change set. Content-only PRs (every changed file is content/** md/yml or public/images/**)
  # skip the code checks (typecheck, lint). Pushes to main/staging and any non-content change run everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      content_only: ${{ steps.classify.outputs.content_only }}
    steps:
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
            echo "Not a PR: full checks"
            exit 0
          fi
          # filename plus previous_filename, so a rename out of a code path is not mistaken for content
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          echo "$files"
          if [[ -z "$files" ]]; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          other=$(echo "$files" | grep -Ev '^(content/.+\.(md|yml)|public/images/.+\.(png|jpe?g|webp|avif|gif|svg|mp4|webm))$' || true)
          if [[ -z "$other" ]]; then
            echo "content_only=true" >> "$GITHUB_OUTPUT"
            echo "Content-only PR: fast path"
          else
            echo "content_only=false" >> "$GITHUB_OUTPUT"
            echo "Non-content files changed:"; echo "$other"
          fi

  typecheck:
    needs: changes
    if: needs.changes.outputs.content_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Run typecheck
        run: pnpm exec nuxi typecheck --colors

  lint:
    needs: changes
    if: needs.changes.outputs.content_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Cache ESLint
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('**/*.{js,ts,vue}') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Run lint
        run: pnpm exec eslint . --ext .js,.ts,.vue --color --cache --cache-location .eslintcache

  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Validate content frontmatter
        run: pnpm run validate:content

      - name: Check content formatting (matches Nuxt Studio)
        run: pnpm run content:format:check

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Lint commits
        run: |
          pnpm exec commitlint --from=origin/${{ github.base_ref }} --to=HEAD || {
            echo "::error title=Commit Lint Error::One or more commit messages do not follow conventional format"
            exit 1
          }

  firebase-preview:
    # Optional preview environment: never gates merges (not in ci-success). Skipped for Dependabot PRs
    # (keyed on the PR author, not whoever triggered the run) and forks, which get no Firebase secrets.
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    # Run after validation passes. Typecheck/lint are skipped on content-only PRs, so gate on validate-content
    # plus "not failed" for the others (a skipped dependency would otherwise skip this job too).
    needs: [changes, typecheck, lint, validate-content]
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.details_url }}
    permissions:
      checks: write
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Build for deployment
        run: pnpm run generate

      - name: Deploy to Firebase Hosting Preview
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALLIE_PORTFOLIO_PROJECT }}
          projectId: allie-portfolio-project
          expires: 7d

  # Builds the static site once and audits it: SEO gate (check:seo) plus Lighthouse CI against the
  # generated .output/public (no dependency on the optional Preview environment). Every step runs
  # even if an earlier check failed so the PR comment is always posted; the last step fails the job.
  lighthouse:
    if: github.event_name == 'pull_request'
    needs: [typecheck, lint, validate-content]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky comment; read-only on Dependabot/fork PRs, where the post is skipped gracefully
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Build static site
        run: pnpm run generate

      - name: SEO checks
        id: seo
        continue-on-error: true
        run: pnpm run check:seo

      - name: Lighthouse collect
        id: collect
        continue-on-error: true
        run: pnpm exec lhci collect

      - name: Lighthouse assert
        id: assert
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: pnpm exec lhci assert

      - name: Upload reports to temporary public storage
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: pnpm exec lhci upload --target=temporary-public-storage

      - name: Build report
        if: always()
        env:
          SEO_CHECK_OUTCOME: ${{ steps.seo.outcome }}
        run: |
          node scripts/lighthouse-summary.mjs > lighthouse-comment.md
          cat lighthouse-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update PR comment
        if: always()
        continue-on-error: true # Dependabot and fork PRs get a read-only token
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('lighthouse-comment.md', 'utf8')
            const marker = '<!-- lighthouse-ci-report -->'
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find(c => c.body?.includes(marker))
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

      - name: Fail on SEO or Lighthouse errors
        if: always()
        run: |
          if [[ "${{ steps.seo.outcome }}" != "success" || "${{ steps.collect.outcome }}" != "success" || "${{ steps.assert.outcome }}" != "success" ]]; then
            echo "::error::SEO check: ${{ steps.seo.outcome }}, Lighthouse collect: ${{ steps.collect.outcome }}, Lighthouse assert: ${{ steps.assert.outcome }}"
            exit 1
          fi

  # Summary job to report overall CI status. This is the required check, so it always runs.
  # Skipped jobs (content-only PRs skip typecheck/lint) count as passing; failure or cancelled fails it.
  ci-success:
    if: always()
    needs: [changes, typecheck, lint, validate-content, commitlint]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::One or more required CI jobs failed ($r)"
              exit 1
            fi
          done
          echo "All CI checks passed"
