name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# A new push to a PR supersedes the previous run. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 1
  CI: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Run typecheck
        run: pnpm exec nuxi typecheck --colors

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Cache ESLint
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('**/*.{js,ts,vue}') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Run lint
        run: pnpm exec eslint . --ext .js,.ts,.vue --color --cache --cache-location .eslintcache

  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Validate content frontmatter
        run: pnpm run validate:content

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Lint commits
        run: |
          pnpm exec commitlint --from=origin/${{ github.base_ref }} --to=HEAD || {
            echo "::error title=Commit Lint Error::One or more commit messages do not follow conventional format"
            exit 1
          }

  firebase-preview:
    # Optional preview environment: never gates merges (not in ci-success). Skipped for Dependabot PRs
    # (keyed on the PR author, not whoever triggered the run) and forks, which get no Firebase secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    needs: [typecheck, lint, validate-content] # Run after validation passes
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.details_url }}
    permissions:
      checks: write
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Build for deployment
        run: pnpm run generate

      - name: Deploy to Firebase Hosting Preview
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALLIE_PORTFOLIO_PROJECT }}
          projectId: allie-portfolio-project
          expires: 7d

  # Summary job to report overall CI status
  ci-success:
    if: always()
    needs: [typecheck, lint, validate-content, commitlint]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          # Check if any required job failed
          if [[ "${{ needs.typecheck.result }}" == "failure" ||
                "${{ needs.lint.result }}" == "failure" ||
                "${{ needs.validate-content.result }}" == "failure" ||
                ("${{ needs.commitlint.result }}" == "failure" && "${{ github.event_name }}" == "pull_request") ]]; then
            echo "::error::One or more required CI jobs failed"
            exit 1
          fi

          echo "All CI checks passed"
