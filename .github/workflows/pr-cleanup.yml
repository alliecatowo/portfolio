name: PR Cleanup

# Deletes a PR's Firebase preview channel when the PR closes (merged or not). The preview job in
# ci.yml lets action-hosting-deploy name the channel `pr<number>-<branch>`, and its 7-day expiry is
# only a backstop. Same-repo PRs only: fork and Dependabot PRs never get a preview channel.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-preview-channel:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALLIE_PORTFOLIO_PROJECT }}

      - name: Delete the PR's preview channel
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx --yes firebase-tools@15 hosting:channel:list --project allie-portfolio-project --json > channels.json
          channels=$(jq -r '.result.channels[].name | sub(".*/channels/"; "")' channels.json | grep -E "^pr${PR_NUMBER}-" || true)
          if [ -z "$channels" ]; then
            echo "No preview channel for PR #${PR_NUMBER}"
            exit 0
          fi
          for channel in $channels; do
            echo "Deleting channel $channel"
            npx --yes firebase-tools@15 hosting:channel:delete "$channel" --project allie-portfolio-project --force
          done
