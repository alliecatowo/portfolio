hero:
  title: Hi, I'm Allison!
  subtitle: "Software engineer: agent systems, developer tools, languages & runtimes"
  image:
    src: /images/ghibli-pfp.png
    alt: Illustrated portrait of Allison Coleman
    status: Open to hackathons & side-project collabs
  stats:
    - label: WebMCP Challenge winners
      value: 1 of 10
    - label: Rescued chinchillas
      value: "2"
    - label: Red Bull consumed
      value: ∞
  body: |
    I'm a software engineer at Hinge Health, living in the Bay Area. I build agent systems, developer tools, and languages and runtimes, and after hours I keep the firmware for my split keyboards and a homelab running. Mostly I yell at robots and occasionally program things.

    Lately that means agents that work inside the tools you already have open instead of a chatbot bolted on the side, typed shells and languages for agent workflows, and terminals that don't waste your GPU.
  award:
    label: OpenAI WebMCP Challenge winner · JupyterLite WebMCP
    to: /projects/jupyterlite-webmcp/
  buttons:
    - label: View My Work
      to: /projects/
      variant: magnet
      color: primary
      size: lg
      icon: i-lucide-folder
      iconPosition: leading
    - label: Contact Me
      to: /contact/
      variant: outline
      color: primary
      size: lg
      icon: i-lucide-mail
      iconPosition: leading
journey:
  title: How I Got Here
  items:
    - title: Origins
      period: Age 11
      color: primary
      icon: i-lucide-joystick
      description: I needed to know how computers worked, so I built little Linux boxes and small games. Then a social network for my middle-school friends, Android apps in Java, and Unity games for the HoloLens at CART.
    - title: CS at CSUMB
      period: 2018–2021
      color: purple-500
      icon: i-lucide-graduation-cap
      description: Computer Science at Cal State Monterey Bay. Built Tetris up from NAND gates, shipped to AWS and Heroku, and did machine learning before OpenAI made it everyone's personality.
    - title: Parsec Education
      period: 2021–2025
      color: primary
      icon: i-lucide-rocket
      description: Joined a five-person startup as a data-entry clerk and automated my own job within a month. They made me an engineer; I left as Software Engineer III after building the core platform, leading AI R&D, and mentoring five interns.
    - title: Hinge Health & the Bay
      period: Feb 2026
      color: purple-500
      icon: i-lucide-map-pin
      description: Got hired at Hinge Health and moved to the Bay Area. New job, new city, same robots to yell at.
layout: about
life:
  title: Outside of Code
  description: The parts of my life that don't compile.
  cards:
    - title: Tattooing
      color: pink-500
      icon: i-lucide-pen-tool
      image: /images/personal/allison-tattooing.jpg
      alt: Allison in a tattoo studio wearing a headlamp and holding a pink tattoo machine, next to a client's forearm with a fresh line-work frog tattoo
      imagePosition: 50% 35%
      featured: true
      description: I tattoo, mostly linework, botanicals and custom pieces drawn with the client. It scratches the same itch as code (precision, patience, someone else's vision) except there's no undo.
    - title: Chinchilla Mom
      color: purple-500
      icon: i-lucide-heart
      image: /images/chinchillas/1d1239a1-1bd9-410a-8152-737a19353b7f.jpg
      alt: Ray, a grey chinchilla, eating from a metal bowl in a hay-filled cage
      imagePosition: 50% 30%
      description: Ray (gentle giant, professional loaf) and Paddy (pure mischief) are rescues. They're nocturnal, so they supervise my late-night coding.
    - title: Split Keyboards
      color: primary
      icon: i-lucide-keyboard
      image: /images/workspace/coding-setup-2.jpg
      alt: Allison's desk with a laptop and two monitors above a pink split keyboard on a pink desk mat, next to a Hello Kitty figure
      imagePosition: 50% 80%
      to: /projects/zmk-sofle-hdock-fork/
      description: A pink Sofle on my own ZMK fork with an OLED dongle, plus a Lily58 with a trackpad. I maintain the firmware so other people can start with splits too.
    - title: Homelab
      color: yellow-500
      icon: i-lucide-server
      image: /images/homelab/screenshot-2025-10-16-at-13-07-11-jelly-seerr-allie-cat-cinema.png
      alt: Jellyseerr request page from Allison's self-hosted media server
      imagePosition: 50% 0%
      to: /projects/homelab-hetzner-media-box/
      description: A 16TB Hetzner auction box running my family's media library and a pile of self-hosted apps. I like owning my data.
    - title: Small Games
      color: pink-500
      icon: i-lucide-gamepad-2
      image: /images/termagatchi/termagatchi-2025-09-28-t17-06-13-176682.png
      alt: Termagatchi running in a terminal, with stat bars, a pixel-art pet, and a chat with the pet
      imagePosition: 50% 50%
      to: /projects/termagatchi/
      description: Where it started. These days it's things like Termagatchi, an AI pet that lives in your terminal.
now:
  title: Now
  description: Software engineer at Hinge Health by day. After hours I build agent systems, developer tools and languages, mostly in public and mostly in Rust and TypeScript. My JupyterLite WebMCP was one of 10 winners of the 2026 OpenAI WebMCP Challenge.
  award:
    label: Read about the winning project
    to: /projects/jupyterlite-webmcp/
  projects:
    - title: Ticketmaster
      to: /projects/ticket-master/
      description: A Rust coding-agent runtime where background workers take tickets and you review the result.
    - title: Patches
      to: /projects/patches/
      description: A chronological social network you use from the terminal.
    - title: Glassy
      to: /projects/glassy/
      description: A lean GPU terminal emulator in Rust, built for Claude Code.
    - title: puml
      to: /projects/puml/
      description: PlantUML-compatible diagrams without Java, compiled in Rust.
    - title: Lumen
      to: /projects/lumen/
      description: A Markdown-native, statically typed language for agent workflows.
    - title: Shoal
      to: /projects/shoal/
      description: An agent-first structured shell with typed values instead of pipes.
