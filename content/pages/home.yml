  description: Software engineer building agent systems, developer tools, and languages/runtimes. Creator of JupyterLite WebMCP, one of 10 winners of the 2026 OpenAI WebMCP Challenge.
hero:
  title: Allison Coleman
  description: Software engineer building agent systems, developer tools, languages and runtimes — and the occasional weird computer.
