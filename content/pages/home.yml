    to: /projects/jupyterlite-webmcp/
  note:
    prefix: Press
    keys:
      - ⌘
      - K
    suffix: to open quick search
  card:
    title: JupyterLite WebMCP
    description: Your notebook is already in the browser. Now your agent can be too.
    introduction: A browser agent that works in the notebook you already have open (same unsaved cells, same selection, same kernel), with every change visible and reviewable in place. No server, no API key, no chatbot bolted on.
    image: /images/projects/jupyterlite-webmcp/card.webp
    imageAlt: JupyterLite notebook with the Agent panel in Propose mode. An agent's proposed edit is shown as a red and green diff under the cell, with Accept and Deny buttons, waiting for review.
    badges:
      - title: Agent systems
        items:
          - JupyterLite WebMCP
          - Ticketmaster
      - title: Languages & runtimes
        items:
          - Lumen
          - Shoal
          - puml
      - title: Developer tools
        items:
          - Glassy
          - Ticketmaster
      - title: Social systems
        items:
