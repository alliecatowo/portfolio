hero:
  title: Allison Coleman
  description: Software engineer building agent systems, developer tools, and languages & runtimes. After hours, I maintain the firmware for my own split keyboards.
  award:
    label: "OpenAI WebMCP Challenge winner: JupyterLite WebMCP"
    to: /projects/jupyterlite-webmcp/
  note:
    prefix: Press
    keys:
      - ⌘
      - K
    suffix: to open quick search
  card:
    title: JupyterLite WebMCP
    description: Your notebook is already in the browser. Now your agent can be too.
    introduction: A browser agent that works in the notebook you already have open (same unsaved cells, same selection, same kernel), with every change visible and reviewable in place. No server, no API key, no chatbot bolted on.
    image: /images/projects/jupyterlite-webmcp/card.webp
    imageAlt: JupyterLite notebook with the Agent panel in Propose mode. An agent's proposed edit is shown as a red and green diff under the cell, with Accept and Deny buttons, waiting for review.
    badges:
      - title: Agent systems
        items:
          - JupyterLite WebMCP
          - Ticketmaster
      - title: Languages & runtimes
        items:
          - Lumen
          - Shoal
          - puml
      - title: Developer tools
        items:
          - Glassy
          - Ticketmaster
      - title: Social systems
        items:
          - Patches
          - GitHub Stories
    buttons:
      - label: See the project
        to: /projects/jupyterlite-webmcp/
        variant: solid
        color: primary
        size: lg
        icon: i-lucide-arrow-right
        iconPosition: trailing
      - label: Try the live demo
        href: https://jupyterlite-web-mcp.vercel.app/lab/index.html
        external: true
        variant: outline
        color: primary
        size: lg
        icon: i-lucide-external-link
        iconPosition: trailing
      - label: All projects
        to: /projects/
        variant: ghost
        color: primary
        size: lg
  buttons: []
  paragraphs: []
  stats: []
